name: Destroy EKS session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "Existing session identifier"
        required: true
        type: string
      confirmation:
        description: "Type DESTROY-<session_id>"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: llm-session-destroy-${{ inputs.session_id }}
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirmation == format('DESTROY-{0}', inputs.session_id)
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DESTROY_ROLE_ARN }}
      - name: Terraform init
        working-directory: infra/session
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.FOUNDATION_STATE_BUCKET }}" \
            -backend-config="key=sessions/${{ inputs.session_id }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform destroy
        working-directory: infra/session
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_session_id: ${{ inputs.session_id }}
          TF_VAR_expires_at: "2099-01-01T00:00:00Z"
          TF_VAR_foundation_state_bucket: ${{ vars.FOUNDATION_STATE_BUCKET }}
          TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
          TF_VAR_model_artifact_bucket: ${{ vars.MODEL_ARTIFACT_BUCKET }}
          TF_VAR_model_artifact_key: ${{ vars.MODEL_ARTIFACT_KEY }}
          TF_VAR_model_artifact_sha256: ${{ vars.MODEL_ARTIFACT_SHA256 }}
        run: terraform destroy -auto-approve -input=false
      - name: Verify no session resources remain
        env:
          SESSION_ID: ${{ inputs.session_id }}
        run: |
          test -z "$(aws eks list-clusters --query "clusters[?contains(@, '${SESSION_ID}')]" --output text)"
          test -z "$(aws ec2 describe-instances --filters "Name=tag:SessionId,Values=${SESSION_ID}" "Name=instance-state-name,Values=pending,running,stopping,stopped" --query 'Reservations[].Instances[].InstanceId' --output text)"
          test -z "$(aws ec2 describe-nat-gateways --filter "Name=tag:SessionId,Values=${SESSION_ID}" "Name=state,Values=available,pending,deleting" --query 'NatGateways[].NatGatewayId' --output text)"
          echo "No tagged EKS, EC2, or NAT resources remain."
