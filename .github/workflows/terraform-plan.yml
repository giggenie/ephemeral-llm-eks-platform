name: Terraform plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "charts/**"
      - "argocd/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: plan
    strategy:
      matrix:
        root: [foundation, session]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN || vars.AWS_BOOTSTRAP_ROLE_ARN }}
      - name: Terraform init
        working-directory: infra/${{ matrix.root }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.FOUNDATION_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.root }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform validate
        working-directory: infra/${{ matrix.root }}
        run: terraform validate
      - name: Terraform plan
        working-directory: infra/${{ matrix.root }}
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_github_repository: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}
          TF_VAR_foundation_state_bucket: ${{ vars.FOUNDATION_STATE_BUCKET }}
          TF_VAR_session_id: "plan-${{ github.run_id }}"
          TF_VAR_expires_at: "2099-01-01T00:00:00Z"
          TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
          TF_VAR_model_artifact_bucket: ${{ vars.MODEL_ARTIFACT_BUCKET }}
          TF_VAR_model_artifact_key: ${{ vars.MODEL_ARTIFACT_KEY }}
          TF_VAR_model_artifact_sha256: ${{ vars.MODEL_ARTIFACT_SHA256 }}
        run: |
          terraform plan -input=false -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.root }}
          path: infra/${{ matrix.root }}/tfplan
          retention-days: 7
