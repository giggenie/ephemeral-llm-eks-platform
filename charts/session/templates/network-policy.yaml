apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "llm-session.fullname" . }}
  namespace: {{ .Values.session.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-session.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "llm-session.name" . }}
  egress:
    - {}
