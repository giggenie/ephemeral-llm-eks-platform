apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-session.fullname" . }}
  namespace: {{ .Values.session.namespace }}
  labels:
    {{- include "llm-session.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: false
