apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-session.fullname" . }}-gateway
  namespace: {{ .Values.session.namespace }}
  labels:
    {{- include "llm-session.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-session.name" . }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "llm-session.name" . }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ include "llm-session.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.gateway.servicePort }}
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-session.fullname" . }}-gateway
  namespace: {{ .Values.session.namespace }}
  labels:
    {{- include "llm-session.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: {{ include "llm-session.name" . }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.servicePort }}
      targetPort: http
