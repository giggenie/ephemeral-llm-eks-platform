{{- if .Values.model.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-session.fullname" . }}-model
  namespace: {{ .Values.session.namespace }}
  labels:
    {{- include "llm-session.labels" . | nindent 4 }}
    app.kubernetes.io/component: model
spec:
  replicas: {{ .Values.model.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-session.name" . }}
      app.kubernetes.io/component: model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "llm-session.name" . }}
        app.kubernetes.io/component: model
    spec:
      nodeSelector:
        karpenter.sh/nodepool: gpu-spot
      tolerations:
        - key: accelerator
          operator: Equal
          value: gpu
          effect: NoSchedule
      {{- if .Values.model.artifactUri }}
      initContainers:
        - name: hydrate-model
          image: {{ .Values.model.artifactImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /models
              aws s3 cp {{ .Values.model.artifactUri | quote }} /tmp/model.tar.gz
              echo "{{ .Values.model.sha256 }}  /tmp/model.tar.gz" | sha256sum -c -
              tar -xzf /tmp/model.tar.gz -C /models
          volumeMounts:
            - name: model-storage
              mountPath: /models
      {{- end }}
      containers:
        - name: model
          image: {{ .Values.model.image | quote }}
          args:
            - "--model"
            - {{ if .Values.model.artifactUri }}/models{{ else }}{{ .Values.model.name | quote }}{{ end }}
            - "--max-model-len"
            - {{ .Values.model.maxModelLen | quote }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.model | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- if .Values.model.artifactUri }}
      volumes:
        - name: model-storage
          emptyDir:
            sizeLimit: 200Gi
      {{- end }}
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-session.fullname" . }}-model
  namespace: {{ .Values.session.namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "llm-session.name" . }}
    app.kubernetes.io/component: model
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
