apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-session.fullname" . }}-gateway
  namespace: {{ .Values.session.namespace }}
data:
  default.conf: |
    server {
      listen {{ .Values.gateway.servicePort }};
      location / {
        {{- if .Values.gateway.authEnabled }}
        auth_basic "LLM session";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        {{- end }}
        proxy_pass http://{{ include "llm-session.fullname" . }}-model:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
      }
    }
